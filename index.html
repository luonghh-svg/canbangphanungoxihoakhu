<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Redox Master Final</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0d0d0d; --card: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 850px; margin: auto; background: var(--card); border: 2px solid var(--neon); border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(0,255,204,0.3); }
        
        /* Cố định kích thước hệ số level 3 */
        .coeff { 
            width: 60px !important; 
            height: 50px !important;
            font-size: 2rem !important; /* To gấp đôi chỉ số chất */
            background: #000 !important; 
            border: none !important;
            border-bottom: 3px solid var(--neon) !important; 
            color: var(--neon) !important; 
            text-align: center !important;
            font-weight: bold !important;
            margin: 0 5px !important;
        }

        /* Style cho Level 2 dựa trên hình ảnh */
        .lvl2-img-container { position: relative; display: inline-block; margin: 20px 0; }
        .lvl2-img { max-width: 100%; border-radius: 10px; border: 1px solid #444; }
        .box-l2 { 
            position: absolute; 
            background: rgba(255, 204, 0, 0.9); 
            border: 2px solid #000; 
            text-align: center; 
            font-weight: bold; 
            border-radius: 5px;
            color: #000;
        }

        .header { display: flex; justify-content: space-between; color: var(--neon); font-weight: bold; padding: 10px; border-bottom: 1px solid #333; }
        .eq-display { font-size: 1.8rem; margin: 30px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .btn-check { background: var(--neon); color: #000; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 1.1rem; }
        .btn-check:hover { background: #fff; box-shadow: 0 0 15px var(--neon); }
        .hidden { display: none; }
        sub { font-size: 0.8rem; vertical-align: sub; }
    </style>
</head>
<body>

<div class="container">
    <div id="screen-login">
        <h1 style="color: var(--neon)">REDOX MASTER</h1>
        <input type="text" id="name" placeholder="Họ tên" style="padding: 10px; width: 200px;">
        <input type="text" id="class" placeholder="Lớp" style="padding: 10px; width: 100px;">
        <br><button class="btn-check" onclick="start()">BẮT ĐẦU</button>
    </div>

    <div id="screen-game" class="hidden">
        <div class="header">
            <div>LVL: <span id="lvl">1</span></div>
            <div id="timer">⏱ 60s</div>
            <div>ĐIỂM: <span id="score">0</span></div>
        </div>
        <h3 id="instruction" style="color: #ffcc00"></h3>

        <div id="lvl2-zone" class="hidden">
            <div class="lvl2-img-container">
                <img src="https://i.imgur.com/uF97z3l.png" class="lvl2-img" alt="Redox Diagram">
                <input class="box-l2" id="in0" style="width: 40px; left: 10%; bottom: 5%;" placeholder="?">
                <input class="box-l2" id="in1" style="width: 40px; left: 35%; bottom: 5%;" placeholder="?">
                <input class="box-l2" id="in2" style="width: 100px; left: 40%; top: 5%;" placeholder="Quá trình?">
                <input class="box-l2" id="in3" style="width: 100px; left: 60%; bottom: 5%;" placeholder="Quá trình?">
            </div>
        </div>

        <div id="eq-zone" class="eq-display"></div>

        <div id="controls"></div>
        <p id="hint" style="color: #ff4444; font-style: italic;"></p>
        <button class="btn-check" onclick="checkAnswer()">XÁC NHẬN</button>
    </div>
</div>

<script>
    let state = { lvl: 1, idx: 0, score: 0, name: "", class: "", ansL1: null };
    const GOOGLE_URL = "URL_CUA_BAN";

    const questions = {
        lvl1: [
            { q: "4NH3 + 5O2 → 4NO + 6H2O", a: true },
            { q: "CuO + 2HCl → CuCl2 + H2O", a: false },
            { q: "MnO2 + 4HCl → MnCl2 + Cl2 + 2H2O", a: true }
        ],
        lvl2: [
            { a: ["O", "K", "KHỬ", "OXI HÓA"] } // MnO2 + HCl mẫu
        ],
        lvl3: [
            { q: "NH3 + O2 → N2 + H2O", a: ["4", "3", "2", "6"] },
            { q: "Cu + HNO3 → Cu(NO3)2 + NO + H2O", a: ["3", "8", "3", "2", "4"] },
            { q: "Zn + H2SO4 → ZnSO4 + S + H2O", a: ["3", "4", "3", "1", "4"] },
            { q: "KMnO4 + HCl → KCl + MnCl2 + Cl2 + H2O", a: ["2", "16", "2", "2", "5", "8"] }
        ]
    };

    function start() {
        state.name = document.getElementById('name').value;
        state.class = document.getElementById('class').value;
        if(!state.name || !state.class) return alert("Vui lòng điền đủ thông tin!");
        document.getElementById('screen-login').className = 'hidden';
        document.getElementById('screen-game').className = '';
        load();
    }

    function load() {
        const zone = document.getElementById('eq-zone');
        const l2zone = document.getElementById('lvl2-zone');
        const ctrl = document.getElementById('controls');
        const ins = document.getElementById('instruction');
        const q = questions[`lvl${state.lvl}`][state.idx];

        zone.innerHTML = "";
        ctrl.innerHTML = "";
        l2zone.className = "hidden";
        document.getElementById('lvl').innerText = state.lvl;

        if(state.lvl === 1) {
            ins.innerText = "Level 1: Phản ứng có phải Oxi hóa - Khử không?";
            zone.innerHTML = format(q.q);
            ctrl.innerHTML = `<button onclick="state.ansL1=true" style="padding:10px 20px">CÓ</button> 
                             <button onclick="state.ansL1=false" style="padding:10px 20px">KHÔNG</button>`;
        } 
        else if(state.lvl === 2) {
            ins.innerText = "Level 2: Điền K (Khử), O (OXH) và tên Quá trình";
            l2zone.className = ""; // Hiện ảnh
        } 
        else {
            ins.innerText = "Level 3: Điền hệ số cân bằng (Cỡ chữ LỚN)";
            let html = "";
            let inputIdx = 0;
            q.q.split(" ").forEach(p => {
                if(["+", "→"].includes(p)) html += ` ${p} `;
                else html += `<input class="coeff" id="in${inputIdx++}">${format(p)} `;
            });
            zone.innerHTML = html;
        }
    }

    function checkAnswer() {
        const q = questions[`lvl${state.lvl}`][state.idx];
        let ok = false;

        if(state.lvl === 1) ok = (state.ansL1 === q.a);
        else {
            const user = q.a.map((_, i) => document.getElementById('in'+i).value.trim().toUpperCase());
            ok = user.every((v, i) => v === q.a[i]);
        }

        if(ok) {
            state.score += 10;
            document.getElementById('score').innerText = state.score;
            state.idx++;
            if(state.idx >= questions[`lvl${state.lvl}`].length) {
                state.idx = 0; state.lvl++;
                if(state.lvl > 3) return finish();
            }
            load();
        } else {
            document.getElementById('hint').innerText = "Sai rồi, hãy kiểm tra lại!";
        }
    }

    function format(t) { return t.replace(/(\d+)/g, "<sub>$1</sub>"); }

    function finish() {
        alert("Hoàn thành! Điểm: " + state.score);
        // Fetch gửi Google Sheets ở đây...
    }
</script>
</body>
</html>
