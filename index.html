<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redox Master Game</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0a0a0a; --wrong: #ff4444; }
        body { background-color: var(--bg); color: #fff; font-family: 'Courier New', monospace; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-card { width: 90%; max-width: 800px; border: 2px solid var(--neon); padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,255,204,0.2); position: relative; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 20px; color: var(--neon); font-weight: bold; }
        .equation-box { background: #1a1a1a; padding: 25px; border-radius: 10px; font-size: 1.4rem; margin: 20px 0; border-left: 5px solid var(--neon); }
        .input-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; }
        input { background: #222; border: 1px solid var(--neon); color: var(--neon); padding: 8px; border-radius: 5px; text-align: center; font-size: 1rem; }
        button { background: var(--neon); color: #000; border: none; padding: 12px 25px; font-weight: bold; cursor: pointer; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 10px var(--neon); }
        .hint { color: #888; margin-top: 15px; font-style: italic; min-height: 20px; }
        sub { font-size: 0.6em; }
        .lvl-desc { color: var(--neon); text-transform: uppercase; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="game-card">
    <div class="stats">
        <div>LEVEL: <span id="lvl-tag">1</span></div>
        <div id="timer-box">⏱ <span id="timer">30</span>s</div>
        <div>SCORE: <span id="score">0</span></div>
    </div>

    <div id="lvl-desc" class="lvl-desc">Xác định phản ứng oxi hóa - khử</div>
    <div class="equation-box" id="eq-display">4NH3 + 5O2 → 4NO + 6H2O</div>
    
    <div id="game-ui">
        </div>

    <div class="hint" id="hint-box"></div>
</div>

<script>
    // --- DỮ LIỆU GAME ---
    const gameData = [
        {
            level: 1,
            desc: "Nhận diện phản ứng Oxi hóa - Khử",
            questions: [
                { q: "4NH₃ + 5O₂ → 4NO + 6H₂O", a: "true", h: "N thay đổi từ -3 lên +2" },
                { q: "CuO + 2HCl → CuCl₂ + H₂O", a: "false", h: "Đây là phản ứng trao đổi" },
                { q: "MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O", a: "true", h: "Cl thay đổi từ -1 lên 0" }
            ]
        },
        {
            level: 2,
            desc: "Xác định vai trò và quá trình (K: Khử, O: Oxi hóa)",
            questions: [
                { 
                    q: "4NH₃ + 5O₂ → 4NO + 6H₂O", 
                    a: ["NH3", "O2", "oxi hóa", "khử"], 
                    h: "Chất khử NH3 (N -3 → +2), Chất oxi hóa O2 (0 → -2)" 
                }
            ]
        },
        {
            level: 3,
            desc: "Cân bằng phương trình (Điền hệ số)",
            questions: [
                { 
                    q: "?NH₃ + ?O₂ → ?N₂ + ?H₂O", 
                    a: ["4", "3", "2", "6"], 
                    h: "B1: N(-3)→N2(0) nhường 6e. B2: O2(0)→O(-2) nhận 4e. Hệ số 4:3" 
                }
            ]
        }
    ];

    let currentLvl = 0;
    let currentQ = 0;
    let score = 0;
    let timer;
    let timeLeft = 45;

    // --- ÂM THANH (Sử dụng Audio Web API) ---
    function playSfx(type) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if(type === 'correct') {
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        } else {
            osc.frequency.setValueAtTime(110, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        }
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
    }

    // --- LOGIC TRÒ CHƠI ---
    function initGame() {
        const lvlObj = gameData[currentLvl];
        const qObj = lvlObj.questions[currentQ];
        
        document.getElementById('lvl-tag').innerText = lvlObj.level;
        document.getElementById('lvl-desc').innerText = lvlObj.desc;
        document.getElementById('eq-display').innerHTML = qObj.q;
        document.getElementById('hint-box').innerText = "";
        
        const ui = document.getElementById('game-ui');
        ui.innerHTML = "";

        if(lvlObj.level === 1) {
            ui.innerHTML = `<button onclick="check(1, 'true')">Đúng</button> 
                           <button onclick="check(1, 'false')" style="background:#ff4444">Sai</button>`;
        } else if(lvlObj.level === 2) {
            ui.innerHTML = `
                <input id="ans0" placeholder="Chất khử (K)"> 
                <input id="ans1" placeholder="Chất OXH (O)"> <br><br>
                Quá trình: <input id="ans2" placeholder="..."> Quá trình: <input id="ans3" placeholder="...">
                <br><br><button onclick="check(2)">Gửi đáp án</button>`;
        } else {
            ui.innerHTML = `
                Hệ số: <input id="ans0" style="width:40px"> <input id="ans1" style="width:40px"> 
                <input id="ans2" style="width:40px"> <input id="ans3" style="width:40px">
                <br><br><button onclick="check(3)">Kiểm tra cân bằng</button>`;
        }
    }

    function check(lvl, val) {
        const qObj = gameData[currentLvl].questions[currentQ];
        let isCorrect = false;

        if(lvl === 1) isCorrect = (val === qObj.a);
        else {
            const inputs = Array.from({length: qObj.a.length}, (_, i) => document.getElementById('ans'+i).value.toLowerCase().trim());
            isCorrect = inputs.every((v, i) => v === qObj.a[i].toLowerCase());
        }

        if(isCorrect) {
            playSfx('correct');
            score += 10;
            document.getElementById('score').innerText = score;
            nextStep();
        } else {
            playSfx('wrong');
            document.getElementById('hint-box').innerText = "Gợi ý: " + qObj.h;
        }
    }

    function nextStep() {
        currentQ++;
        if(currentQ >= gameData[currentLvl].questions.length) {
            currentQ = 0;
            currentLvl++;
            if(currentLvl >= gameData.length) {
                alert("CHIẾN THẮNG! TỔNG ĐIỂM: " + score);
                location.reload();
                return;
            }
            alert("Vượt cấp! Chào mừng tới Level " + (currentLvl + 1));
        }
        initGame();
    }

    function startTimer() {
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            if(timeLeft <= 0) {
                clearInterval(timer);
                alert("Game Over! Điểm của bạn: " + score);
                location.reload();
            }
        }, 1000);
    }

    initGame();
    startTimer();
</script>
</body>
</html>
