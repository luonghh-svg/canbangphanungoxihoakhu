<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>REDOX MASTER - BẢN CHUẨN</title>
    <style>
        :root { --neon: #00ffcc; --bg: #0d0d0d; --blue-box: #4a76c0; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: auto; background: #1a1a1a; border: 3px solid var(--neon); border-radius: 15px; padding: 20px; box-shadow: 0 0 25px rgba(0,255,204,0.3); }
        
        /* Level 1 & 3: Fix hệ số to ngang nguyên tố */
        .equation-row { display: flex; align-items: center; justify-content: center; font-size: 2.2rem; gap: 8px; margin: 30px 0; }
        .coeff-big { font-size: 2.2rem; font-weight: bold; color: var(--neon); min-width: 30px; text-align: center; }
        .sub { font-size: 1.1rem; vertical-align: sub; line-height: 0; }
        
        /* Input cho Level 3 */
        .input-coeff { width: 55px; height: 50px; font-size: 2.2rem; text-align: center; background: #000; border: 2px solid var(--neon); color: var(--neon); font-weight: bold; border-radius: 5px; }

        /* Level 2: Sơ đồ hiển thị rõ ràng */
        .lvl2-container { position: relative; margin: 50px auto; width: 800px; height: 250px; background: #222; border-radius: 10px; border: 1px solid #444; }
        .eq-lvl2 { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8rem; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .box-blue { position: absolute; background: var(--blue-box); border: 1px solid #fff; color: #fff; width: 45px; height: 35px; text-align: center; font-weight: bold; font-size: 1.2rem; border-radius: 4px; }
        
        .header { display: flex; justify-content: space-between; color: var(--neon); font-weight: bold; padding: 10px; border-bottom: 2px solid #333; }
        .btn { background: var(--neon); color: #000; border: none; padding: 15px 40px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-screen">
        <h1 style="color: var(--neon)">REDOX MASTER GAME</h1>
        <input type="text" id="studentName" placeholder="Tên học sinh" style="padding: 12px; width: 250px;"><br>
        <button class="btn" onclick="start()">BẮT ĐẦU</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header">
            <div>LEVEL: <span id="lvl">1</span></div>
            <div id="timer-box">⏱ <span id="timer">15</span>s</div>
            <div>ĐIỂM: <span id="score">0</span></div>
        </div>

        <h3 id="hint-text" style="color: #ffcc00; margin: 20px 0;"></h3>

        <div id="main-display"></div>

        <div id="controls"></div>
        <button id="confirm-btn" class="btn hidden" onclick="checkAnswer()">XÁC NHẬN</button>
    </div>
</div>

<script>
    let state = { lvl: 1, idx: 0, score: 0, time: 15, timer: null };

    // Dữ liệu chính xác từ file tài liệu của bạn
    const database = {
        lvl1: [
            { q: "4 NH3 + 5 O2 → 4 NO + 6 H2O", a: true },
            { q: "CuO + 2 HCl → CuCl2 + H2O", a: false },
            { q: "2 Ca + O2 → 2 CaO", a: true },
            { q: "Mg + H2SO4 đ → MgSO4 + SO2 + H2O", a: true },
            { q: "MnO2 + 4 HCl → MnCl2 + Cl2 + 2 H2O", a: true },
            { q: "Na2O + H2O → 2 NaOH", a: false }
        ],
        lvl2: [
            { q: "4 NH3 + 5 O2 → 4 NO + 6 H2O", a: ["K", "O", "O", "K"], pos: [{b:30,l:15}, {b:30,l:25}, {t:20,l:35}, {b:30,l:55}] },
            { q: "2 Ca + O2 → 2 CaO", a: ["K", "O", "O", "K"], pos: [{b:30,l:20}, {b:30,l:30}, {t:20,l:45}, {b:30,l:60}] },
            { q: "Mg + H2SO4 → MgSO4 + SO2 + H2O", a: ["K", "O", "O", "K"], pos: [{b:30,l:15}, {b:30,l:28}, {t:20,l:45}, {b:30,l:65}] },
            { q: "MnO2 + 4 HCl → MnCl2 + Cl2 + 2 H2O", a: ["O", "K", "O"], pos: [{b:30,l:20}, {b:30,l:35}, {b:30,l:60}] }
        ],
        lvl3: [
            { q: "NH3 + O2 → NO + H2O", a: ["4", "5", "4", "6"] },
            { q: "Cu + HNO3 → Cu(NO3)2 + NO + H2O", a: ["3", "8", "3", "2", "4"] },
            { q: "Zn + H2SO4 → ZnSO4 + S + H2O", a: ["3", "4", "3", "1", "4"] },
            { q: "KMnO4 + HCl → KCl + MnCl2 + Cl2 + H2O", a: ["2", "16", "2", "2", "5", "8"] }
        ]
    };

    function start() {
        if(!document.getElementById('studentName').value) return alert("Em nhập tên nhé!");
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        render();
    }

    function render() {
        clearInterval(state.timer);
        const display = document.getElementById('main-display');
        const ctrl = document.getElementById('controls');
        const confirmBtn = document.getElementById('confirm-btn');
        const q = database[`lvl${state.lvl}`][state.idx];

        display.innerHTML = ""; ctrl.innerHTML = "";
        document.getElementById('lvl').innerText = state.lvl;

        if (state.lvl === 1) {
            state.time = 15;
            document.getElementById('hint-text').innerText = "PHẢN ỨNG CÓ PHẢI OXI HÓA - KHỬ?";
            display.innerHTML = `<div class="equation-row">${formatEq(q.q)}</div>`;
            ctrl.innerHTML = `<button class="btn" onclick="checkL1(true)" style="background:#4CAF50; margin:10px">ĐÚNG</button>
                             <button class="btn" onclick="checkL1(false)" style="background:#f44336; margin:10px">SAI</button>`;
            confirmBtn.classList.add('hidden');
            startTimer();
        } 
        else if (state.lvl === 2) {
            state.time = 30;
            document.getElementById('hint-text').innerText = "ĐIỀN VAI TRÒ K (KHỬ) HOẶC O (OXI HÓA)";
            confirmBtn.classList.remove('hidden');
            let html = `<div class="lvl2-container"><div class="eq-lvl2">${formatEq(q.q)}</div>`;
            q.a.forEach((_, i) => {
                let style = `left:${q.pos[i].l}%; ${q.pos[i].t ? 'top:'+q.pos[i].t+'px' : 'bottom:'+q.pos[i].b+'px'}`;
                html += `<input id="in-${i}" class="box-blue" style="${style}" maxlength="1">`;
            });
            display.innerHTML = html + `</div>`;
            startTimer();
        }
        else {
            document.getElementById('timer-box').innerText = "THỜI GIAN: ∞";
            document.getElementById('hint-text').innerText = "CÂN BẰNG PHƯƠNG TRÌNH (HỆ SỐ TO)";
            confirmBtn.classList.remove('hidden');
            let inputCount = 0;
            let parts = q.q.split(" ").map(p => {
                if (["+", "→"].includes(p)) return p;
                return `<input id="in-${inputCount++}" class="input-coeff">${formatEq(p)}`;
            }).join(" ");
            display.innerHTML = `<div class="equation-row">${parts}</div>`;
        }
    }

    function checkL1(ans) {
        if(ans === database.lvl1[state.idx].a) state.score += 10;
        updateScore(); next();
    }

    function checkAnswer() {
        const q = database[`lvl${state.lvl}`][state.idx];
        let correct = 0;
        q.a.forEach((val, i) => {
            if(document.getElementById(`in-${i}`).value.trim().toUpperCase() === val) correct++;
        });

        if(state.lvl === 2) state.score += (correct * 5);
        if(state.lvl === 3 && correct === q.a.length) state.score += 30;
        updateScore(); next();
    }

    function startTimer() {
        document.getElementById('timer').innerText = state.time;
        state.timer = setInterval(() => {
            state.time--;
            document.getElementById('timer').innerText = state.time;
            if(state.time <= 0) { clearInterval(state.timer); next(); }
        }, 1000);
    }

    function next() {
        state.idx++;
        if(state.idx >= database[`lvl${state.lvl}`].length) {
            state.idx = 0; state.lvl++;
        }
        if(state.lvl > 3) return alert("HOÀN THÀNH! ĐIỂM CỦA EM: " + state.score);
        render();
    }

    function updateScore() { document.getElementById('score').innerText = state.score; }

    function formatEq(text) {
        // Biến các số lẻ loi thành chỉ số dưới (H2O -> H2O), giữ nguyên số đứng đầu (hệ số)
        return text.replace(/([A-Z][a-z]?)(\d+)/g, '$1<span class="sub">$2</span>')
                   .replace(/(\d+)([A-Z])/g, '<span class="coeff-big">$1</span>$2');
    }
</script>
</body>
</html>
