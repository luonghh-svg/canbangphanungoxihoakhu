<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Game cân bằng phản ứng oxi hóa – khử</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 20px;
}
h1 {
  text-align: center;
}
.level {
  background: white;
  padding: 20px;
  border-radius: 10px;
  max-width: 900px;
  margin: auto;
}
.reaction {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  font-size: 18px;
}
.box {
  text-align: center;
}
input {
  width: 40px;
  text-align: center;
  font-size: 16px;
}
.role {
  margin-top: 4px;
}
button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}
#message {
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>🎮 Game cân bằng phản ứng oxi hóa – khử</h1>

<div class="level">
  <h2 id="title"></h2>

  <div class="reaction" id="reaction"></div>

  <button onclick="check()">✅ Kiểm tra</button>
  <button onclick="next()">➡ Level tiếp theo</button>

  <div id="message"></div>
</div>

<script>
const levels = [
  {
    title: "Level 1 – Cơ bản",
    reaction: [
      { f: "Zn", coef: 1, role: "K" },
      { f: "+ CuSO₄ →", coef: 1, role: "O" },
      { f: "ZnSO₄ +", coef: 1 },
      { f: "Cu", coef: 1 }
    ]
  },
  {
    title: "Level 2 – Trung bình",
    reaction: [
      { f: "Fe", coef: 1, role: "K" },
      { f: "+ CuSO₄ →", coef: 1, role: "O" },
      { f: "FeSO₄ +", coef: 1 },
      { f: "Cu", coef: 1 }
    ]
  },
  {
    title: "Level 3 – Khó",
    reaction: [
      { f: "Cu", coef: 3, role: "K" },
      { f: "+ HNO₃ →", coef: 8, role: "O" },
      { f: "Cu(NO₃)₂ +", coef: 3 },
      { f: "NO +", coef: 2 },
      { f: "H₂O", coef: 4 }
    ]
  },
  {
    title: "Level 4 – Nâng cao",
    reaction: [
      { f: "KMnO₄", coef: 2, role: "O" },
      { f: "+ HCl →", coef: 16, role: "K" },
      { f: "KCl +", coef: 2 },
      { f: "MnCl₂ +", coef: 2 },
      { f: "Cl₂ +", coef: 5 },
      { f: "H₂O", coef: 8 }
    ]
  }
];

let current = 0;

function render() {
  document.getElementById("title").innerText = levels[current].title;
  const div = document.getElementById("reaction");
  div.innerHTML = "";

  levels[current].reaction.forEach((item, i) => {
    const box = document.createElement("div");
    box.className = "box";
    box.innerHTML = `
      <input id="coef${i}" placeholder="?" />
      <div>${item.f}</div>
      ${item.role ? `<input id="role${i}" class="role" placeholder="K/O">` : ""}
    `;
    div.appendChild(box);
  });

  document.getElementById("message").innerText = "";
}

function check() {
  let ok = true;
  levels[current].reaction.forEach((item, i) => {
    if (item.coef != document.getElementById("coef"+i).value) ok = false;
    if (item.role) {
      if (item.role != document.getElementById("role"+i).value.toUpperCase()) ok = false;
    }
  });
  document.getElementById("message").innerText = ok ? "🎉 Chính xác!" : "❌ Chưa đúng, thử lại nhé!";
}

function next() {
  if (current < levels.length - 1) {
    current++;
    render();
  } else {
    alert("🎓 Bạn đã hoàn thành tất cả level!");
  }
}

render();
</script>

</body>
</html>
